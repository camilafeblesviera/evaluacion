<style>

<script>

const SP=[["pesas","Pesas / fuerza",5],["correr","Correr",9],["caminar","Caminar rápido",3.5],["ciclismo","Ciclismo",7.5],["natacion","Natación",8],["equipo","Deportes de equipo",8],["crossfit","CrossFit / HIIT",9],["marcial","Artes marciales / boxeo",9],["baile","Baile / aeróbicos",5],["yoga","Yoga / pilates",3]];
const IN=[[.7,"Ligera"],[1,"Moderada"],[1.25,"Vigorosa"],[1.5,"Máxima"]];
const OC=[[1.2,"Sedentaria (oficina)"],[1.3,"Ligera (de pie, camina a ratos)"],[1.4,"Moderada (trabajo activo)"],[1.55,"Intensa (trabajo físico pesado)"]];

const CI=[["neck","Cuello","De pie y mirando al frente, con los hombros relajados. Cinta justo debajo de la nuez (laringe), horizontal y sin apretar."],["waist","Cintura","De pie, relajada, al final de una exhalación normal. Cinta horizontal en el punto más estrecho entre la última costilla y la cadera; si no se distingue, a la altura del ombligo. No metas el abdomen."],["hip","Cadera / glúteo","De pie, pies juntos y glúteos relajados. Cinta horizontal en la parte más prominente de los glúteos, vista de lado."],["arm","Brazo relajado","Brazo derecho colgando. Marca el punto medio entre la punta del hombro (acromion) y la punta del codo (olécranon) con el codo a 90°; mide ahí con el brazo suelto y relajado."],["thigh","Muslo medio","De pie, con el peso en la otra pierna. Punto medio entre el pliegue de la ingle y el borde superior de la rótula; cinta horizontal en ese punto."],["calf","Pantorrilla","De pie, pies a la anchura de la cadera y peso repartido. Cinta horizontal en el punto de mayor grosor de la pantorrilla."]];
const GO={perder:["Bajar de peso","Déficit: 80 % del gasto",.8,2.2],mantener:["Mantenerme","100 % del gasto",1,1.8],ganar:["Subir masa muscular","Superávit: 110 % del gasto",1.1,2]};
const MEALS=["Desayuno","Almuerzo","Cena","Colación"];
const STN=["Sedentario","Inactivo","Activo","Atleta","Alto rendimiento"],STD=["Sin ejercicio y trabajo sedentario","Menos de 600 MET·min/sem","600 a 2 999 MET·min/sem","3 000 o más MET·min/sem","6 000 o más y 5+ días/sem"];
const FD=[["Huevo entero",143,12.6,.7,9.5,50],["Pechuga de pollo cocida",165,31,0,3.6,120],["Carne de res magra cocida",250,26,0,15,120],["Salmón cocido",208,20,0,13,120],["Pescado blanco cocido",105,23,0,1,120],["Atún en agua",116,26,0,1,100],["Arroz blanco cocido",130,2.7,28,.3,150],["Pasta cocida",158,5.8,31,.9,150],["Papa cocida",87,1.9,20,.1,150],["Avena cruda",389,16.9,66,6.9,40],["Pan integral",247,13,41,3.4,30],["Tortilla de maíz",218,5.7,45,2.9,30],["Frijoles cocidos",127,8.7,23,.5,150],["Lentejas cocidas",116,9,20,.4,150],["Quinoa cocida",120,4.4,21,1.9,150],["Plátano",89,1.1,23,.3,120],["Manzana",52,.3,14,.2,180],["Naranja",47,.9,12,.1,130],["Aguacate",160,2,9,15,70],["Brócoli cocido",34,2.8,7,.4,100],["Ensalada mixta",20,1.4,3.6,.2,100],["Leche entera",61,3.2,4.8,3.3,240],["Leche descremada",34,3.4,5,.1,240],["Yogur natural",61,3.5,4.7,3.3,170],["Queso fresco",264,17,3,20,40],["Almendras",579,21,22,50,28],["Cacahuate",567,26,16,49,28],["Aceite de oliva",884,0,0,100,10],["Mantequilla",717,.9,.1,81,10],["Proteína whey (polvo)",400,80,8,6,30],["Pizza",266,11,33,10,110],["Hamburguesa",295,17,24,14,150],["Refresco",42,0,10.6,0,355],["Chocolate",546,5,60,31,25]];
function loadCU(){const c=ALL.cust||{},ad=(A,L)=>(L||[]).forEach(x=>{if(!A.some(y=>y[0]===x[0]))A.push(x)});ad(SP,c.sp);ad(OC,c.oc);ad(IN,c.in);ad(MV,c.mv);ad(FD,c.fd);(c.ml||[]).forEach(m=>{if(!MEALS.includes(m))MEALS.push(m)})}
const cat=(b,m)=>{const t=m?[6,14,18,25]:[14,21,25,32];return["Grasa esencial","Atlético","Fitness","Promedio","Obesidad"][t.filter(x=>b>=x).length]};
function an(){const s=S,a=num(s.age),h=num(s.h),w=num(s.w),m=s.sex==="m",o={a,h,w,m};
 if(!a||!h||!w){o.ok=false;return o}o.ok=true;
 const c=k=>num(s.c[k]),M=[];
 o.bmi=w/((h/100)**2);
 
 
 
 const wa=c("waist"),hi=c("hip");
 
 const dz=1.2*o.bmi+.23*a-10.8*(m?1:0)-5.4;M.push({n:"Deurenberg (IMC, edad y sexo)",bf:dz,p:0,st:`1.20·${f1(o.bmi)} + 0.23·${a} − 10.8·${m?1:0} − 5.4 = ${f1(dz)} %`});
 const nv=M.find(x=>x.p===2),U=[nv].filter(Boolean);if(!U.length)U.push(M[0]);
 U.forEach(x=>x.u=1);o.M=M;o.bf=Math.min(60,Math.max(2,U.reduce((t,x)=>t+x.bf,0)/U.length));o.conf="Estimada";
 o.fat=w*o.bf/100;o.lean=w-o.fat;o.ffmi=o.lean/((h/100)**2)+6.1*(1.8-h/100);
 o.whr=wa&&hi?wa/hi:null;o.whtr=wa?wa/h:null;
 
 
 o.smm=o.lean*.5;o.smmM="Estimación (≈50 % de la masa magra)";o.smmS=`${f1(o.lean)} kg × 0.50 = ${f1(o.smm)} kg. Es una estimación: el músculo no se mide directamente sin DEXA o pliegues.`
 o.mus=o.smm/w*100;
 o.bmrK=370+21.6*o.lean;o.bmrM=10*w+6.25*h-5*a+(m?5:-161);o.bmr=o.bmrK;
 const sp=SP.find(x=>x[0]===s.sport)||SP[0],days=+s.days,mn=num(s.min)||0;
 o.sp=sp;o.mt=sp[2]*(+s.int||1);o.mm=o.mt*mn*days;o.ses=(o.mt-1)*w*mn/60;o.exD=o.ses*days/7;o.neat=o.bmr*(+s.occ-1);o.tdee=o.bmr*(+s.occ)+o.exD;
 o.st=days===0?(+s.occ<=1.2?0:1):o.mm<600?1:o.mm<3000?2:(o.mm>=6000&&days>=5?4:3);
 const IB=(m?[[15,20],[14,20],[12,17],[8,14],[6,13]]:[[23,29],[21,28],[20,25],[14,20],[12,19]])[o.st];o.ib=IB;o.keep=o.st>=3||(o.bf>=IB[0]&&o.bf<=IB[1]);o.ibm=(IB[0]+IB[1])/2;o.iw=o.lean/(1-o.ibm/100);o.iwMin=o.lean/(1-IB[0]/100);o.iwMax=o.lean/(1-IB[1]/100);const G=GO[s.goal],fl=m?1500:1200;o.kcal=Math.max(Math.round(o.tdee*G[2]),fl);o.fl=o.tdee*G[2]<fl;
 o.prot=G[3]*w;o.fatG=o.kcal*.25/9;o.carb=Math.max(0,(o.kcal-o.prot*4-o.kcal*.25)/4);
 return o}
function render(){$("#who").innerHTML=`<select aria-label="Persona" onchange="switchP(this.value)">${ALL.people.map(x=>`<option value="${x.id}" ${x.id===S.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select><button onclick="addP()">+ Persona</button>`;
 $("#app").innerHTML=V[tab]();
 $("#nav").innerHTML=[["perfil","👤","Perfil"],["med","📏","Medidas"],["res","📊","Análisis"],["prog","📈","Progreso"],["com","🍽️","Comidas"],["ent","🏋️","Entreno"]].map(t=>`<button class="${tab===t[0]?"on":""}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join("")}
function go(t){tab=t;cd=false;render();scrollTo(0,0)}
function set(k,v){S[k]=v;save()}
function setN(g,k,v){S[g][k]=v;save()}

function setGoal(g){S.goal=g;save();render()}
function setFd(v){fd=v||today();render()}
function saveEval(){const o=an();if(!o.ok)return $("#msg").textContent="Completa edad, altura y peso en Perfil.";const d=$("#ed").value||today(),c=S.c;S.hist=(S.hist||[]).filter(x=>x.d!==d);S.hist.push({id:Date.now(),d,w:o.w,bf:o.bf,fat:o.fat,lean:o.lean,smm:o.smm,mus:o.mus,bmi:o.bmi,whr:o.whr,whtr:o.whtr,neck:num(c.neck),waist:num(c.waist),arm:num(c.arm),thigh:num(c.thigh),calf:num(c.calf),goal:S.goal,conf:o.conf});save();pa=pb=null;go("prog")}
function delEval(id){S.hist=S.hist.filter(x=>x.id!==id);save();pa=pb=null;render()}
const E=()=>S.e=S.e||{t:[],l:[],par:[],inj:"",med:"",cons:0,s:[],ph:[],n:[]};
let et="r";
const rd=id=>num($("#"+id).value),dv=id=>$("#"+id).value||today(),ago=d=>(new Date(today())-new Date(d))/864e5,mg=t=>{$("#msg").textContent=t};
const fi=(i,l)=>`<label>${l}<input id="${i}" type="number" inputmode="decimal" step="any"></label>`,dx=(k,id)=>`<button class="x" aria-label="Borrar" onclick="delE('${k}',${id})">✕</button>`,dt=i=>`<label>Fecha<input id="${i}" type="date" value="${today()}"></label>`;
const PQ=["¿Un médico le ha dicho que tiene un problema del corazón y que solo debe hacer la actividad física que él recomiende?","¿Siente dolor en el pecho al hacer actividad física?","¿Ha tenido dolor en el pecho en reposo durante el último mes?","¿Pierde el equilibrio por mareos o ha perdido el conocimiento alguna vez?","¿Tiene un problema de huesos o articulaciones que podría empeorar con la actividad física?","¿Le receta su médico medicamentos para la presión arterial o el corazón?","¿Conoce alguna otra razón por la que no deba hacer actividad física?"];
function setEt(x){et=x;render()}
function setE(k,v){E()[k]=v;save()}
function parq(i,v){const p=E().par;p[i]=v===""?null:+v;save();render()}
function delE(k,id){const e=E();e[k]=e[k].filter(x=>x.id!==id);save();render()}
function cmpT(R,A,B){let m=0,s=0,z=0;const rows=R.map(([n,k,dir,tol,dc])=>{const a=A[k],b=B[k];if(a==null||b==null)return"";const d=b-a;let st,cl="";if(Math.abs(d)<tol){st="= Se mantuvo";s++}else if(d*dir>0){st="▲ Mejoró";cl="up";m++}else{st="▼ Empeoró";cl="dn";z++}return`<tr><td>${n}</td><td>${a.toFixed(dc)}</td><td>${b.toFixed(dc)}</td><td>${d>0?"+":""}${d.toFixed(dc)}</td><td class="${cl}">${st}</td></tr>`}).join("");return`<div class="wrap"><table><tr><th>Prueba</th><th>Antes</th><th>Después</th><th>Cambio</th><th>Estado</th></tr>${rows}</table></div><p class="mut">${m} mejoraron · ${s} se mantuvieron · ${z} empeoraron</p>`}
function saveT(){const e=E(),o={id:Date.now(),d:dv("tdt"),w:num(S.w)},rm=k=>{const kg=rd("k_"+k),r=rd("r_"+k);return kg?(r&&r>1?kg*(1+r/30):kg):null};o.sq=rm("s");o.bp=rm("b");o.dl=rm("d");o.cl=rm("c");o.fs=rm("f");o.sn=rm("n");o.oh=rm("o");o.cj=rm("j");MV.filter(m=>m[0].length>3).forEach(m=>{o[m[0]]=rm(m[0])});
 if(![o.sq,o.bp,o.dl,o.cl,o.fs,o.sn,o.oh,o.cj,...MV.filter(m=>m[0].length>3).map(m=>o[m[0]])].some(v=>v!=null))return mg("Captura al menos una prueba.");e.t=e.t.filter(x=>x.d!==o.d);e.t.push(o);e.t.sort((a,b)=>a.d<b.d?-1:1);save();render()}
function saveL(){const e=E(),o={id:Date.now(),d:dv("ld"),rpe:rd("lr"),min:rd("lm"),sl:rd("ls"),fa:rd("lf"),pn:rd("lp")};if(!o.rpe&&!o.sl)return mg("Captura al menos el esfuerzo o el sueño.");e.l.push(o);e.l.sort((a,b)=>a.d<b.d?-1:1);save();render()}

<div class="card"><h2>% de grasa y peso de referencia</h2><div class="stats">${o.keep?`<div>% de grasa de referencia (${STN[o.st]})<b>${o.ib[0]}–${o.ib[1]} %</b></div><div>Tu % de grasa<b>${f1(o.bf)} %</b></div>`:`<div>% de grasa de referencia (${STN[o.st]})<b>${o.ib[0]}–${o.ib[1]} %</b></div><div>Objetivo de grasa<b>${f1(o.ibm,0)} %</b></div><div>Peso de referencia<b>${f1(o.iw)} kg</b></div><div>Rango de peso<b>${f1(o.iwMin,0)}–${f1(o.iwMax,0)} kg</b></div>`}</div><p class="mut">${o.keep?(o.st>=3?"Tu condición física es "+STN[o.st].toLowerCase()+": el rango de grasa es solo una referencia y no se recomienda cambiar tu peso.":"Tu % de grasa ya está dentro del rango de referencia para tu nivel de actividad; no se recomienda cambiar tu peso."):o.bf>o.ib[1]?"Para llegar a "+f1(o.ibm,0)+" % conservando tu masa magra ("+f1(o.lean)+" kg) deberías bajar ≈ "+f1(o.w-o.iw)+" kg de grasa.":"Estás por debajo del rango ideal; llegar a "+f1(o.ibm,0)+" % implicaría ganar ≈ "+f1(o.iw-o.w)+" kg."}${o.keep?"":" Peso de referencia = masa magra ÷ (1 − % de grasa objetivo) = "+f1(o.lean)+" ÷ (1 − "+f1(o.ibm,0)+"/100). Es solo una guía, no una meta obligatoria."}</p></div><div class="card"><h2>Método de % de grasa: Deurenberg</h2><p class="mut"><b>¿Qué es?</b> Una ecuación de predicción publicada por Deurenberg, Weststrate y Seidell (1991) que estima el porcentaje de grasa corporal sin equipo de laboratorio, usando solo el IMC, la edad y el sexo.</p><p><b>Fórmula:</b> % grasa = 1.20 × IMC + 0.23 × edad − 10.8 × sexo − 5.4 <span class="mut">(sexo: 1 = hombre, 0 = mujer)</span></p><p class="mut"><b>Cómo se usa, paso a paso con estos datos:</b><br>1) Mide peso (kg) y altura (m) como se indica en Medidas.<br>2) IMC = peso ÷ altura² = ${o.w} ÷ (${f1(o.h/100,2)})² = ${f1(o.bmi,2)}.<br>3) Sustituye: 1.20 × ${f1(o.bmi,2)} + 0.23 × ${o.a} − 10.8 × ${o.m?1:0} − 5.4 = ${f1(o.M[0].bf)} %.<br>4) Interpreta con la categoría: ${cat(o.bf,o.m)}.</p><p class="mut"><b>Por qué funciona:</b> la grasa tiende a aumentar con el IMC y con la edad (se pierde masa magra) y es mayor en mujeres; la fórmula resume esa relación observada en grupos grandes de personas.</p><p class="mut"><b>Precisión y límites:</b> es una estimación; puede desviarse varios puntos porcentuales (típicamente 3 a 5) frente a métodos de referencia como DEXA o el pesaje hidrostático. Sobrestima la grasa en personas muy musculosas (el IMC alto es por músculo) y puede subestimarla en quienes tienen poca masa muscular. No usa perímetros: solo cambia si cambian el peso, la edad o la altura. No es válida para menores de 15 años ni en embarazo. Sirve mejor para dar seguimiento a la misma persona en el tiempo.</p><p class="mut"><b>Para explicarlo en una frase:</b> «Es una fórmula que calcula tu grasa a partir de tu IMC, tu edad y tu sexo; sirve para seguir tu evolución, no es una medición directa.»</p></div>
<div class="card"><h2>Gasto energético diario</h2>${tb(["Componente","kcal/día"],[["TMB Katch-McArdle (usada)",f1(o.bmrK,0)],["TMB Mifflin-St Jeor (ref.)",f1(o.bmrM,0)],["Actividad diaria (×"+ob+")",f1(o.neat,0)],["Ejercicio",f1(o.exD,0)],["<b>Gasto total</b>","<b>"+f1(o.tdee,0)+"</b>"]])}
<p class="mut">Cada sesión de ${num(S.min)||0} min gasta ≈ ${f1(o.ses,0)} kcal netas.</p></div>
<div class="card"><h2>Objetivo y calorías a consumir</h2><div class="opts">${Object.entries(GO).map(([k,v])=>`<button class="opt ${S.goal===k?"on":""}" onclick="setGoal('${k}')">${v[0]}<small>${v[1]}</small></button>`).join("")}</div>
<div class="big mt">${o.kcal}<span class="mut"> kcal/día</span></div><div class="mut">${f1(o.tdee,0)} × ${G[2]} = ${f1(o.tdee*G[2],0)}${o.fl?" → mínimo seguro aplicado":""}</div>
<div class="mt">${tb(["Macro","Gramos","g/kg","kcal","% kcal"],[mk("Proteína ("+G[3]+" g/kg)",o.prot,4),mk("Grasa (25 % kcal)",o.fatG,9),mk("Carbohidratos (resto)",o.carb,4)])}</div></div>
<div class="card"><h2>Reparto por comida (4 comidas)</h2><div class="stats"><div>Proteína<b>${f1(o.prot/4,0)} g</b></div><div>Carbohidratos<b>${f1(o.carb/4,0)} g</b></div><div>Grasa<b>${f1(o.fatG/4,0)} g</b></div><div>Calorías<b>${f1(o.kcal/4,0)} kcal</b></div></div><p class="mut">Divide la proteína en 3 a 5 tomas de ≈0.25 a 0.4 g/kg (${f1(o.w*.25,0)} a ${f1(o.w*.4,0)} g).</p></div>
<div class="card"><h2>Suplementación según tu objetivo (${GO[S.goal][0]})</h2>${(()=>{const w=o.w,g=S.goal,cl=(v,a,b)=>Math.min(b,Math.max(a,v)),rec={perder:{w:"Si no llegas a tu meta de proteína",c:"Recomendada",b:"Opcional (si entrenas en ayunas)",e:"Opcional"},mantener:{w:"Solo si te falta proteína",c:"Recomendada",b:"No necesaria",e:"No necesarios"},ganar:{w:"Recomendada",c:"Recomendada",b:"Opcional",e:"Opcional"}}[g],it=[["Proteína en polvo (whey o vegetal)",rec.w,Math.round(cl(w*.35,20,40)/5)*5+" g por toma, "+(g==="ganar"?"1 a 2 veces":"1 vez")+" al día","Mezclada con agua o leche, después de entrenar o entre comidas. Sirve para completar tus "+f1(o.prot,0)+" g de proteína al día; no sustituye comida."],["Creatina monohidratada",rec.c,f1(cl(w*.03,3,5))+" g al día (≈0.03 g/kg)","Todos los días, también los de descanso, con una comida o bebida y buena hidratación; la hora no importa. Opcional: carga de 20 g/día en 4 tomas durante 5 a 7 días."],["BCAA",rec.b,f1(cl(w*.1,5,10),0)+" g (≈0.1 g/kg)","Antes o durante el entrenamiento, en agua. Aportan poco si tu proteína total ya llega a la meta; útiles en ayunas o con déficit calórico."],["Aminoácidos esenciales (EAA)",rec.e,"10 g por toma, 1 vez al día","Disueltos en agua antes o después del entrenamiento, sobre todo si pasarás horas sin comer proteína."]];return it.map(x=>supRow(x[0],x[1],x[2],x[3],(SUI[x[0]]||[])[0],(SUI[x[0]]||[])[1])).join("")+((ALL.cust&&ALL.cust.su)||[]).map(x=>supRow(x.n,x.r,x.d,x.c,x.f,x.b,x.id)).join("")+`<button class="btn" onclick="addSup()">+ Agregar otro suplemento</button><div id="msg"></div>`})()}<p class="mut">Los suplementos no son obligatorios: primero cubre calorías y macros con comida. Consulta a un médico o nutriólogo si hay enfermedad renal, embarazo, medicación o si es menor de edad, y elige productos con sello de calidad (NSF, Informed Sport) si compite.</p></div>
<div class="card"><details><summary>Cálculo paso a paso</summary>${o.M.map(x=>`<p><b>${x.n}:</b> ${x.st}</p>`).join("")}<p><b>Músculo:</b> ${o.smmS}</p>
<p><b>Masa magra:</b> ${f1(o.w)} − ${f1(o.fat)} = ${f1(o.lean)} kg · <b>TMB Katch:</b> 370 + 21.6 × ${f1(o.lean)} = ${f1(o.bmrK,0)} · <b>Mifflin:</b> 10·${o.w} + 6.25·${o.h} − 5·${o.a} ${o.m?"+ 5":"− 161"} = ${f1(o.bmrM,0)}</p>
<p><b>Total:</b> ${f1(o.bmr,0)} × ${ob} + ${f1(o.exD,0)} = ${f1(o.tdee,0)} kcal/día. Ejercicio neto = (MET − 1) × peso × horas × días / 7.</p></details>
<p class="mut">Son estimaciones con fórmulas validadas; no sustituyen una evaluación médica o nutricional.</p></div>`},
ent(){return W.seg()+W[et]()},
prog(){const L=(S.hist||[]).slice().sort((a,b)=>a.d<b.d?-1:1);if(!L.length)return`<div class="note">Aún no hay evaluaciones guardadas. En Mediciones captura tus datos y toca Guardar evaluación. Repite cada mes para ver tu progreso.</div>`;
 const A=L.find(x=>x.id===pa)||L[Math.max(0,L.length-2)],B=L.find(x=>x.id===pb)||L[L.length-1],opt=z=>L.map(x=>`<option value="${x.id}" ${x.id===z.id?"selected":""}>${x.d}</option>`).join("");
 const hist=`<div class="card"><h2>Evaluaciones guardadas</h2>${[...L].reverse().map(x=>`<div class="row"><span>${x.d} · ${f1(x.w)} kg · ${f1(x.bf)} % grasa</span><button class="x" aria-label="Borrar evaluación" onclick="delEval(${x.id})">✕</button></div>`).join("")}</div>`;
 const sl=`<div class="card"><h2>Comparar</h2><div class="g2"><label>Antes<select onchange="pa=+this.value;render()">${opt(A)}</select></label><label>Después<select onchange="pb=+this.value;render()">${opt(B)}</select></label></div></div>`;
 if(L.length<2)return`<div class="note">Guarda al menos dos evaluaciones para ver la comparativa.</div>`+hist;
 if(A.id===B.id)return sl+`<div class="note">Elige dos fechas distintas.</div>`+hist;
 const wd={perder:-1,ganar:1,mantener:0}[B.goal]||0,cn={m:0,s:0,e:0};
 const R=[["% de grasa","bf",-1,.5,1],["Masa grasa (kg)","fat",-1,.5,1],["Masa magra (kg)","lean",1,.5,1],["Músculo esquelético (kg)","smm",1,.3,1],["Músculo / peso (%)","mus",1,.5,1],["Peso (kg)","w",wd,wd?.5:1,1],["Cintura (cm)","waist",-1,1,1],["Cuello (cm)","neck",0,.5,1],["Cintura/cadera","whr",-1,.01,2],["Cintura/altura","whtr",-1,.01,2],["Brazo (cm)","arm",1,.5,1],["Muslo (cm)","thigh",1,1,1],["Pantorrilla (cm)","calf",1,.5,1]];
 const rows=R.map(([n,k,dir,tol,dc])=>{const a=A[k],b=B[k];if(a==null||b==null)return"";const d=b-a;let st,cl="";if(Math.abs(d)<tol){st="= Se mantuvo";cn.s++}else if(dir===0)st="Cambió";else if(d*dir>0){st="▲ Mejoró";cl="up";cn.m++}else{st="▼ Empeoró";cl="dn";cn.e++}
  return`<tr><td>${n}</td><td>${a.toFixed(dc)}</td><td>${b.toFixed(dc)}</td><td>${d>0?"+":""}${d.toFixed(dc)}</td><td class="${cl}">${st}</td></tr>`}).join("");
 const vd=cn.m>cn.e?["Mejoró","up"]:cn.m<cn.e?["Empeoró","dn"]:["Se mantuvo",""],days=Math.abs(Math.round((new Date(B.d)-new Date(A.d))/864e5));
 return sl+`<div class="card"><h2>Resultado general (${days} días)</h2><div class="big ${vd[1]}">${vd[0]}</div><div class="mut">${cn.m} mejoraron · ${cn.s} se mantuvieron · ${cn.e} empeoraron</div><p class="mut">El % de grasa usa la fórmula Deurenberg, que depende del peso, la edad y el sexo.</p></div><div class="card"><h2>Comparativa</h2><div class="wrap"><table><tr><th>Parámetro</th><th>Antes</th><th>Después</th><th>Cambio</th><th>Estado</th></tr>${rows}</table></div><p class="mut">Mejora: menos grasa y cintura, más masa magra y músculo; el peso se juzga según tu objetivo.</p></div>`+hist},
com(){const o=an(),L=S.log[fd]||[],T=L.reduce((t,x)=>({k:t.k+x.k,p:t.p+x.p,c:t.c+x.c,f:t.f+x.f}),{k:0,p:0,c:0,f:0}),kc=T.k;
 let top="";if(o.ok){const ov=Math.round(kc-o.kcal);top=(ov>0?`<div class="alert">Te pasaste por ${ov} kcal de tu meta de ${o.kcal} kcal.</div>`:"")+`<div class="card"><h2>Total del día vs meta</h2><div class="big">${f1(kc,0)}<span class="mut"> / ${o.kcal} kcal</span></div><div class="bar ${ov>0?"over":""}"><i style="width:${Math.min(100,kc/o.kcal*100)}%"></i></div><div class="mut">${f1(kc/o.kcal*100,0)} % de la meta · ${ov>0?"exceso "+ov:"restan "+-ov} kcal</div>
<div class="wrap mt"><table><tr><th>Macro</th><th>Consumido</th><th>Meta</th><th>% meta</th><th>% kcal</th></tr>${[["Proteína",T.p,o.prot,4],["Carbohidratos",T.c,o.carb,4],["Grasa",T.f,o.fatG,9]].map(r=>`<tr><td>${r[0]}</td><td>${f1(r[1])} g</td><td>${f1(r[2],0)} g</td><td>${f1(r[1]/r[2]*100,0)} %</td><td>${kc?f1(r[1]*r[3]/kc*100,0):0} %</td></tr>`).join("")}</table></div></div>`}
 else top=`<div class="note">Completa tu perfil para comparar contra tu meta diaria. Puedes registrar comidas igualmente.</div>`;
 return top+`<div class="card"><h2>Calculadora de comida</h2><label>Día<input type="date" value="${fd}" onchange="setFd(this.value)"></label>
<div class="g2 mt"><label>Comida<select id="fm" onchange="if(this.value==='__o')oth(this,'ml','')">${MEALS.map(m=>`<option>${m}</option>`).join("")}<option value="__o">Otra (escribir)…</option></select></label><label>Alimento<select onchange="pick(this.value)"><option value="">Elegir…</option>${FD.map((f,i)=>`<option value="${i}">${f[0]}</option>`).join("")}<option value="__o">Otro (no está en la lista)…</option></select></label></div>
<div class="mt"><label>Nombre<input id="fn"></label></div>
<div class="g2 mt"><label>kcal por 100 g<input id="fk" type="number" inputmode="decimal" oninput="pv()"></label><label>Gramos consumidos<input id="fg" type="number" inputmode="decimal" oninput="pv()"></label>
<label>Proteína /100 g<input id="fp" type="number" inputmode="decimal" oninput="pv()"></label><label>Carbohidratos /100 g<input id="fc" type="number" inputmode="decimal" oninput="pv()"></label><label>Grasa /100 g<input id="ff" type="number" inputmode="decimal" oninput="pv()"></label></div>
<label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input id="fsv" type="checkbox" style="width:auto;min-height:0" checked>Guardar este alimento en mi lista</label><p class="mut" id="pv">kcal = gramos ÷ 100 × kcal por 100 g</p><div class="g2"><button class="btn" onclick="stg()">+ Otro alimento en esta comida</button><button class="btn" onclick="addF()">Guardar comida</button></div><div id="stg">${stgH()}</div><p class="mut">Tip: los valores por 100 g vienen en la etiqueta nutricional del producto.</p><div id="msg"></div></div>
<div class="card"><h2>Registro del día</h2>${L.length?MEALS.map(m=>{const e=L.map((x,i)=>[x,i]).filter(x=>x[0].m===m);if(!e.length)return"";const s=e.reduce((t,x)=>t+x[0].k,0);
 return`<div class="mt"><b>${m}</b> · ${f1(s,0)} kcal${kc?" ("+f1(s/kc*100,0)+" % del día)":""}</div>`+e.map(([x,i])=>`<div class="row"><span>${esc(x.n)} · ${f1(x.g,0)} g<br><span class="mut">${f1(x.k,0)} kcal · P ${f1(x.p)} · C ${f1(x.c)} · G ${f1(x.f)}</span></span><button class="x" aria-label="Borrar" onclick="delF(${i})">✕</button></div>`).join("")}).join(""):`<p class="mut">Nada registrado este día.</p>`}</div>`}};
loadCU();render();
</script>
